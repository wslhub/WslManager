name: Package release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a draft GitHub release (major.minor.patch)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/WslManager.Core.Tests -c Release
      - run: dotnet run --project tests/WslManager.UiTests -c Release -- artifacts/ui
      - run: ./scripts/Build-Packages.ps1 -Version $env:RELEASE_VERSION
      - run: ./scripts/Test-Installer.ps1
      - name: Create draft release with packages and hashes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = @(Get-ChildItem artifacts/packages -File | ForEach-Object FullName)
          gh release create "v$env:RELEASE_VERSION" @files --draft --target $env:GITHUB_SHA --title "WslManager $env:RELEASE_VERSION" --notes-file docs/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
